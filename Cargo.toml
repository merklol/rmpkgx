[package]
name = "rmpkgx"
version = "0.1.0"
edition = "2021"
description = "Conservative offline macOS application uninstaller and leftover inspector"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
plist = "1"
tracing = "0.1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
