name: Release candidates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/test-prepare-homebrew.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build Apple Silicon candidate and checksum
        run: ./scripts/package-release.sh
      - name: Prepare source asset and independent Homebrew tap
        run: python3 scripts/prepare-homebrew.py --owner "$GITHUB_REPOSITORY_OWNER"
      - name: Check packaged executable
        run: |
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          tar -xzf dist/rmpkgx-*.tar.gz -C "$stage"
          "$stage"/rmpkgx-*/rmpkgx --version
          "$stage"/rmpkgx-*/rmpkgx --help
      - uses: actions/upload-artifact@v4
        with:
          name: rmpkgx-apple-silicon-candidate
          path: dist/
          if-no-files-found: error
